<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>图片上传与生成</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', Arial, sans-serif;
            /* 💕 超美的粉红渐变背景呀！像梦幻的糖果世界～ */
            background: linear-gradient(135deg, #ff6b9d 0%, #ff8fab 25%, #ffa8c5 50%, #e91e63 75%, #c2185b 100%);
            /* 💝 想要更温柔的感觉？试试这个柔和版～ */
            /* background: linear-gradient(135deg, #ffb3d9 0%, #ff8fab 50%, #ff6b9d 100%); */
            min-height: 100vh;
            max-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            position: relative;
            overflow: hidden;
        }

        /* ✨ 给背景加点小星星装饰，blingbling的～ */
        body::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: float 20s infinite linear;
            pointer-events: none;
        }

        @keyframes float {
            0% {
                transform: translate(0, 0);
            }
            100% {
                transform: translate(50px, 50px);
            }
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 15px 40px rgba(233, 30, 99, 0.3), 0 8px 20px rgba(194, 24, 91, 0.2);
            max-width: 480px;
            width: 100%;
            max-height: 95vh;
            padding: 20px 24px;
            position: relative;
            z-index: 1;
            backdrop-filter: blur(10px);
            overflow-y: auto;
            overflow-x: hidden;
        }

        /* 自定义滚动条样式 */
        .container::-webkit-scrollbar {
            width: 6px;
        }

        .container::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 3px;
        }

        .container::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #ff6b9d 0%, #e91e63 100%);
            border-radius: 3px;
        }

        .container::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, #e91e63 0%, #c2185b 100%);
        }

        h1 {
            color: #333;
            margin-bottom: 6px;
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #ff6b9d 0%, #e91e63 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-align: center;
        }

        .subtitle {
            color: #666;
            margin-bottom: 18px;
            font-size: 12px;
            text-align: center;
            line-height: 1.4;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #333;
            font-weight: 600;
            font-size: 13px;
        }

        .required-mark {
            color: #e91e63;
            margin-left: 4px;
        }

        input[type="file"],
        input[type="text"],
        textarea {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #ffe0e6;
            border-radius: 10px;
            font-size: 13px;
            transition: all 0.3s ease;
            background: #fff;
            font-family: inherit;
            resize: vertical;
        }

        textarea {
            min-height: 70px;
            max-height: 120px;
            line-height: 1.4;
            padding: 10px 12px;
        }

        textarea[readonly] {
            background-color: #f9f9f9;
            cursor: default;
            color: #333;
        }

        textarea[readonly]:focus {
            outline: none;
            border-color: #ff6b9d;
            box-shadow: 0 0 0 3px rgba(255, 107, 157, 0.1);
        }

        input[type="file"]:hover,
        input[type="text"]:hover,
        textarea:hover {
            border-color: #ffb3d9;
        }

        input[type="file"]:focus,
        input[type="text"]:focus,
        textarea:focus {
            outline: none;
            border-color: #ff6b9d;
            box-shadow: 0 0 0 3px rgba(255, 107, 157, 0.1);
        }

        /* 🙈 哎呀，出错啦！红红的提示你注意哦～ */
        input[type="file"].error,
        input[type="text"].error {
            border-color: #e91e63;
            background-color: #fff5f7;
            box-shadow: 0 0 0 3px rgba(233, 30, 99, 0.1);
        }

        input[type="file"].error:focus,
        input[type="text"].error:focus {
            border-color: #c2185b;
            box-shadow: 0 0 0 3px rgba(233, 30, 99, 0.2);
        }

        /* 💌 温柔的错误提示，不要害怕哦～ */
        .error-message {
            display: none;
            margin-top: 6px;
            padding: 6px 10px;
            background: linear-gradient(135deg, #fff5f7 0%, #ffe0e6 100%);
            color: #c2185b;
            border: 1px solid #ffb3d9;
            border-radius: 6px;
            font-size: 12px;
            animation: shake 0.3s ease;
            line-height: 1.4;
        }

        .error-message.show {
            display: block;
        }

        /* 🎀 轻轻摇一摇，提醒你填写信息～ */
        @keyframes shake {
            0%, 100% {
                transform: translateX(0);
            }
            25% {
                transform: translateX(-5px);
            }
            75% {
                transform: translateX(5px);
            }
        }

        button {
            width: 100%;
            /* 💗 超级可爱的粉红按钮！点击就有魔法～ */
            background: linear-gradient(135deg, #ff6b9d 0%, #ff8fab 50%, #e91e63 100%);
            color: white;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 3px 12px rgba(255, 107, 157, 0.4);
            position: relative;
            overflow: hidden;
            margin-top: 4px;
        }

        button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(255, 107, 157, 0.5);
        }

        button:hover::before {
            width: 300px;
            height: 300px;
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: linear-gradient(135deg, #ffb3d9 0%, #ffc1e0 100%);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        button span {
            position: relative;
            z-index: 1;
        }

        #result {
            margin-top: 12px;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 12px;
            display: none;
            animation: slideIn 0.3s ease;
            line-height: 1.4;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        #result.show {
            display: block;
        }

        .success {
            background: linear-gradient(135deg, #d4edda 0%, #c3e6cb 100%);
            color: #155724;
            border: 2px solid #c3e6cb;
        }

        .error {
            background: linear-gradient(135deg, #f8d7da 0%, #f5c6cb 100%);
            color: #721c24;
            border: 2px solid #f5c6cb;
        }

        .info {
            background: linear-gradient(135deg, #fff0f5 0%, #ffe0e6 100%);
            color: #c2185b;
            border: 2px solid #ffb3d9;
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
        }

        .file-name {
            margin-top: 6px;
            font-size: 11px;
            color: #666;
            padding-left: 4px;
            line-height: 1.3;
        }

        /* 文件输入框样式优化 */
        input[type="file"] {
            cursor: pointer;
        }

        input[type="file"]::-webkit-file-upload-button {
            background: linear-gradient(135deg, #ff6b9d 0%, #e91e63 100%);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            margin-right: 12px;
            transition: all 0.3s ease;
        }

        input[type="file"]::-webkit-file-upload-button:hover {
            transform: scale(1.05);
            box-shadow: 0 2px 8px rgba(255, 107, 157, 0.3);
        }

        /* 响应式设计 */
        @media (max-width: 600px) {
            body {
                padding: 8px;
            }

            .container {
                padding: 16px 18px;
                border-radius: 12px;
                max-height: 98vh;
            }

            h1 {
                font-size: 20px;
                margin-bottom: 4px;
            }

            .subtitle {
                font-size: 11px;
                margin-bottom: 14px;
            }

            .form-group {
                margin-bottom: 14px;
            }

            label {
                font-size: 12px;
                margin-bottom: 5px;
            }

            input[type="file"],
            input[type="text"],
            textarea {
                padding: 9px 11px;
                font-size: 12px;
            }

            textarea {
                min-height: 60px;
                max-height: 100px;
            }

            button {
                padding: 11px;
                font-size: 13px;
            }

            .error-message {
                font-size: 11px;
                padding: 5px 9px;
            }
        }

        /* 小屏幕优化 */
        @media (max-height: 700px) {
            .container {
                padding: 16px 20px;
            }

            h1 {
                font-size: 22px;
                margin-bottom: 4px;
            }

            .subtitle {
                font-size: 11px;
                margin-bottom: 14px;
            }

            .form-group {
                margin-bottom: 12px;
            }

            textarea {
                min-height: 60px;
                max-height: 90px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✨ AI魔法工坊 ✨</h1>
        <p class="subtitle">上传你的美照，输入神秘验证码，见证魔法时刻～ 💖</p>

        <form id="uploadForm" novalidate>
            <div class="form-group">
                <label for="fileInput">📸 选择你的美美照片<span class="required-mark">*</span></label>
                <div class="file-input-wrapper">
                    <input type="file" id="fileInput" name="file" accept="image/*" required>
                </div>
                <div class="file-name" id="fileName"></div>
                <div class="error-message" id="fileError"></div>
            </div>

            <div class="form-group">
                <label for="codeInput">🔮 神秘验证码<span class="required-mark">*</span></label>
                <input type="text" id="codeInput" name="code" placeholder="输入你的专属验证码哦～" required>
                <div class="error-message" id="codeError"></div>
            </div>

            <button type="submit" id="submitBtn">
                <span id="btnText">✨ 开始施展魔法 ✨</span>
            </button>
        </form>

        <div id="result"></div>
    </div>

    <script>
        // 🌟 魔法传送门地址！这是我们跟服务器小姐姐联系的秘密通道～
        // 📝 小贴士：这个地址是从 N8N 工作流里拿到的哦
        // 🎯 Form Trigger 方式（更适合可爱的表单提交呢！）
        //const WEBHOOK_URL = 'http://144.126.135.213:5678/form/83a46d1f-b9d1-4883-9375-02d6a2d5efb0';
        
        // 💫 Webhook 方式（我们现在用的是这个啦～）
        const WEBHOOK_URL = 'https://aimagic.duckdns.org/webhook/0b759f7f-0711-4ddb-959b-123ff4cca3e0';

        const form = document.getElementById('uploadForm');
        const fileInput = document.getElementById('fileInput');
        const codeInput = document.getElementById('codeInput');
        const fileName = document.getElementById('fileName');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const resultDiv = document.getElementById('result');
        const fileError = document.getElementById('fileError');
        const codeError = document.getElementById('codeError');

        // 🔍 检查小助手：帮你确认信息都填好了没～
        function validateForm() {
            let isValid = true;
            let firstErrorField = null;

            // 📸 看看有没有选美美的图片呀
            if (!fileInput.files || fileInput.files.length === 0) {
                showError(fileInput, fileError, '还没选照片呢！快选一张美美的吧～');
                isValid = false;
                if (!firstErrorField) firstErrorField = fileInput;
            } else {
                clearError(fileInput, fileError);
            }

            // 🔑 验证码不能空着哦，不然没法验证身份呢
            const codeValue = codeInput.value.trim();
            if (!codeValue) {
                showError(codeInput, codeError, '验证码不能空着哦，快填上吧！');
                isValid = false;
                if (!firstErrorField) firstErrorField = codeInput;
            } else {
                clearError(codeInput, codeError);
            }

            // 🎪 如果有小错误，就轻轻跳到那里提醒你～
            if (!isValid && firstErrorField) {
                firstErrorField.scrollIntoView({ behavior: 'smooth', block: 'center' });
                firstErrorField.focus();
            }

            return isValid;
        }

        // 💔 显示错误提示（不要担心，修改一下就好啦！）
        function showError(input, errorDiv, message) {
            input.classList.add('error');
            errorDiv.textContent = '⚠️ ' + message;
            errorDiv.classList.add('show');
        }

        // ✨ 清除错误（棒棒哒！都改对了～）
        function clearError(input, errorDiv) {
            input.classList.remove('error');
            errorDiv.classList.remove('show');
            errorDiv.textContent = '';
        }

        // 📁 哇！看看你选了什么图片～
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                fileName.textContent = `✓ 已选择：${e.target.files[0].name}`;
                clearError(fileInput, fileError);
            } else {
                fileName.textContent = '';
            }
        });

        // ⌨️ 正在输入验证码...错误提示消失啦！
        codeInput.addEventListener('input', (e) => {
            if (e.target.value.trim()) {
                clearError(codeInput, codeError);
            }
        });

        // 👀 验证码输入完了吗？让我检查一下～
        codeInput.addEventListener('blur', (e) => {
            if (!e.target.value.trim()) {
                showError(codeInput, codeError, '验证码不能空着哦，快填上吧！');
            }
        });

        // 💡 小秘密：不在点击文件按钮时验证哦
        // 因为那时候你还在挑图片呢，不要打扰你选择～
        // 等提交的时候再一起检查就好啦！

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            // 🎯 先确认一下信息都填好了哦
            if (!validateForm()) {
                return;
            }

            // 🚀 按钮暂时休息，防止你不小心重复点击～
            submitBtn.disabled = true;
            btnText.textContent = '✨ 施法中...';
            resultDiv.className = 'info show';
            resultDiv.textContent = '💫 魔法正在施展中，请稍等片刻哦～';

            try {
                const fd = new FormData(form);

                const resp = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    body: fd
                });

                const contentType = resp.headers.get('Content-Type') || '';

                // 🔍 看看服务器小姐姐回复了什么～
                if (!resp.ok) {
                    // 💬 如果是 JSON 格式，我们来看看错误信息
                    if (contentType.includes('application/json')) {
                        try {
                            const errorData = await resp.json();
                            let errorMessage = '';
                            
                            // 🔎 寻找错误信息藏在哪里～
                            if (errorData.message) {
                                errorMessage = errorData.message;
                            } else if (errorData.error) {
                                errorMessage = errorData.error;
                            } else {
                                errorMessage = JSON.stringify(errorData, null, 2);
                            }
                            
                            // 📝 整理一下错误信息，让它更容易理解～
                            let fullMessage = `💔 ${errorMessage}`;
                            if (errorData.error && errorData.error !== errorMessage) {
                                fullMessage += `\n\n错误类型: ${errorData.error}`;
                            }
                            if (errorData.submittedCaptcha) {
                                fullMessage += `\n\n你输入的验证码: ${errorData.submittedCaptcha}`;
                            }
                            
                            // 💖 温柔地告诉你哪里需要改一下
                            resultDiv.className = 'error show';
                            resultDiv.textContent = fullMessage;
                            
                            return; // 🛑 到这里就好啦，不用继续了～
                        } catch (parseError) {
                            // 😵 哎呀，服务器说了奇怪的话，我听不懂...
                            throw new Error(`HTTP ${resp.status}: ${resp.statusText}`);
                        }
                    } else {
                        // 🤔 服务器返回的不是我认识的格式呢...
                        throw new Error(`HTTP ${resp.status}: ${resp.statusText}`);
                    }
                }

                // 🎉 太好啦！服务器说一切顺利～
                if (contentType.startsWith('image/') || contentType.startsWith('application/octet-stream')) {
                    // 🖼️ 哇！是图片文件呢，准备下载啦～
                    const blob = await resp.blob();
                    const disposition = resp.headers.get('Content-Disposition') || '';
                    let filename = 'generated_image.png';
                    const match = disposition.match(/filename="(.+)"/);
                    if (match) filename = match[1];

                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = filename;
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    URL.revokeObjectURL(url);

                    const successMessage = '🎉 耶！魔法成功啦！你的文件正在下载～';
                    resultDiv.className = 'success show';
                    resultDiv.textContent = successMessage;
                    form.reset();
                    fileName.textContent = '';
                } else if (contentType.includes('application/json')) {
                    // 📦 收到 JSON 格式的回复～看看里面说了什么
                    const data = await resp.json();
                    
                    // 🔍 找找重要信息在哪里～
                    let message = '';
                    if (data.response) {
                        message = data.response;
                    } else if (data.message) {
                        message = data.message;
                    } else if (data.error) {
                        message = data.error;
                    } else {
                        message = JSON.stringify(data, null, 2);
                    }

                    if (data.success === false || data.error) {
                        const errorMessage = '💔 ' + message;
                        resultDiv.className = 'error show';
                        resultDiv.textContent = errorMessage;
                    } else {
                        const successMessage = '🎉 ' + message;
                        resultDiv.className = 'success show';
                        resultDiv.textContent = successMessage;
                    }
                } else if (contentType.includes('text/html') || contentType.includes('text/plain')) {
                    // 📝 收到文字消息～
                    const text = await resp.text();
                    resultDiv.className = 'info show';
                    resultDiv.textContent = '💌 服务器小姐姐说：\n\n' + text;
                } else {
                    const errorMessage = '😵 收到了奇怪的响应格式: ' + contentType;
                    resultDiv.className = 'error show';
                    resultDiv.textContent = errorMessage;
                }
            } catch (err) {
                // 🔧 小医生来了！让我看看哪里出问题了～
                let errorMessage = '😢 哎呀出错了: ' + err.message;
                
                // 🍪 检查是不是浏览器的缓存捣乱了
                if (err.message.includes('GET/HEAD method cannot have body') || err.message.includes('Request with GET/HEAD')) {
                    errorMessage += '\n\n🍪 哎呀！浏览器记住旧版本啦！\n\n💝 试试这些小方法：\n1. 按 Ctrl+F5 (Windows) 或 Cmd+Shift+R (Mac) 强制刷新\n2. 或者清除浏览器缓存\n3. 或按 F12 打开控制台 → Network标签 → 勾选"Disable cache"\n4. 然后刷新页面重试～';
                }
                // 🌐 检查是不是网络连接的问题
                else if (err.message.includes('Failed to fetch') || err.message.includes('NetworkError')) {
                    const isHttps = window.location.protocol === 'https:';
                    const isHttpWebhook = WEBHOOK_URL.startsWith('http://');
                    
                    if (isHttps && isHttpWebhook) {
                        errorMessage += '\n\n🔐 安全小姐姐说：HTTPS 和 HTTP 不能混用哦！\n\n💝 试试这些办法：\n1. 让服务器也用 HTTPS（这样更安全哦！）\n2. 或者用 HTTP 访问页面（但不太推荐呢）';
                    } else if (err.message.includes('CORS')) {
                        errorMessage += '\n\n🚧 哎呀！服务器小姐姐不让跨域访问...\n\n💖 解决办法：需要在 N8N 里设置允许跨域访问哦～';
                    } else {
                        // 📋 详细检查清单
                        errorMessage += '\n\n🔍 让我们一起找找问题在哪～\n\n🌐 当前连接地址：\n' + WEBHOOK_URL + '\n\n💝 可能的原因（别担心哦）：\n\n1️⃣ 服务器休息了吗？\n   → 试试访问 http://144.126.135.213:5678 看能不能打开\n\n2️⃣ 工作流忘记启动了？\n   → 登录 N8N，找到 "AI KIT GITHUB" 工作流\n   → 右上角 "Active" 开关要是绿色的才行哦～\n\n3️⃣ 地址输错了？\n   → 在浏览器直接打开：' + WEBHOOK_URL + '\n   → 如果显示 404，说明地址不对呢\n\n4️⃣ 防火墙在捣蛋？\n   → 检查服务器有没有开放 5678 端口\n   → 看看本地防火墙有没有拦截\n\n5️⃣ 网络不稳定？\n   → 试试 ping 144.126.135.213 测一下\n\n6️⃣ 跨域设置没配好？\n   → 在 N8N 环境变量加上：N8N_CORS_ORIGIN=*\n\n🎯 快速测试小技巧：\n1. 访问 http://144.126.135.213:5678\n2. 访问 ' + WEBHOOK_URL + '\n3. 按 F12 打开控制台看详细错误';
                    }

                resultDiv.className = 'error show';

        });
